<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD System — Products</title>

  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div class="container py-5">

    <div class="panel">
      <h1 class="panel-title">CRUD System</h1>

      <form id="productForm" novalidate>
        <input type="hidden" id="productId">

        <div class="field">
          <label for="productName">Product Name</label>
          <input type="text" id="productName" placeholder="e.g. Wireless Headphones" required>
        </div>

        <div class="field">
          <label for="productPrice">Product Price</label>
          <input type="number" id="productPrice" placeholder="e.g. 49.99" step="0.01" min="0" required>
        </div>

        <div class="field">
          <label for="productCategory">Product Category</label>
          <input type="text" id="productCategory" placeholder="e.g. electronics" required>
        </div>

        <div class="field">
          <label for="productDescription">Product Description</label>
          <textarea id="productDescription" rows="4" placeholder="Short description of the product…"></textarea>
        </div>

        <div class="field file-field">
          <label for="productImage">Product Image</label>
          <input type="file" id="productImage" accept="image/*">
          <img id="imagePreview" class="image-preview d-none" alt="Preview">
        </div>

        <div class="form-actions">
          <button type="submit" id="submitBtn" class="btn-primary">Add Product</button>
          <button type="button" id="cancelEditBtn" class="btn-ghost d-none">Cancel</button>
        </div>
      </form>
    </div>

    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="search" id="searchInput" placeholder="Search by name…." autocomplete="off">
    </div>

    <div id="statusMsg" class="status-msg"></div>
    <div class="row g-4" id="productsGrid"></div>

  </div>

  <script src="./js/bootstrap.bundle.min.js"></script>
  <script src="./js/script.js"></script>
</body>
</html>
