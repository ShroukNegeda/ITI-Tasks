<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Box — Find something to cook</title>

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,900&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <header class="hero">
    <div class="container">
      <p class="eyebrow">Recipe Box</p>
      <h1 class="hero-title">What's cooking<br>today?</h1>
      <p class="hero-sub">Search the shelf, or pick an ingredient you already have.</p>

      <div class="search-bar">
        <div class="search-field">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="search" name="searchInput" id="searchInput" placeholder="Search recipes… try “chicken”" autocomplete="off">
        </div>
        <div class="select-field">
          <select name="userSelect" id="userSelect"></select>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="statusMsg" class="status-msg"></div>
    <div class="row g-4" id="dataRow"></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>Recipe Box · powered by the Forkify API</span>
    </div>
  </footer>

  <script src="./js/bootstrap.bundle.min.js"></script>
  <script src="./js/script.js"></script>
</body>
</html>
